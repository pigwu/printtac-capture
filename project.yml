name: PrintTacCapture

options:
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.PrintTacCapture
    INFOPLIST_FILE: ios/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: 1.4
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  PrintTacCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/Assets.xcassets
      - path: ios/PrintTacCaptureApp.swift
      - path: ios/ContentView.swift
      - path: ios/ARCameraPreviewView.swift
      - path: ios/ARUltraWideFrameAccess.swift
      - path: ios/AppSettingsView.swift
      - path: ios/CaptureHistoryView.swift
      - path: ios/PositionViewModel.swift
      - path: ios/ARPoseUDPSender.swift
      - path: ios/ARLowLatencyVideoSender.swift
      - path: ios/MagneticSensorProtocol.swift
      - path: ios/PoseMagneticPacket.swift
      - path: ios/MagneticSensorHotspotGateway.swift
      - path: ios/WiredSensorPoseBridge.swift
      - path: ios/SensorPoseStreamRecorder.swift
      - path: ios/ARSessionVideoRecorder.swift
      - path: ios/PoseDataSessionRecorder.swift
      - path: ios/CaptureLibraryStore.swift
      - path: ios/CaptureUploadService.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO

schemes:
  PrintTacCapture:
    build:
      targets:
        PrintTacCapture: all
    run:
      config: Debug
